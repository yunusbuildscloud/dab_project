# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: f87453b3-ce83-41c6-9584-10b9849d2447

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: "citibike_dev"
  dev_flag:
    default: true
  schema:
    description: The schema to use


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405615083272808.8.azuredatabricks.net
    variables:
      catalog:
        default: "citibike_dev"
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  test:
    mode: production
    presets:
        name_prefix: '[testing] '
    workspace:
      host: https://adb-7405619706312229.9.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/yunusbuildscloud@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_test"
      dev_flag:
        default: false
      schema: prod
    permissions:
      - service_principal_name: 07bc5b0f-b130-479e-8c34-ee202d89d0b6
        level: CAN_MANAGE  
  prod:
    mode: production
    workspace:
      host: https://adb-7405615558298777.17.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/yunusbuildscloud@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_prod"
      dev_flag:
        default: false
      schema: prod
    permissions:
      - service_principal_name: bc6f686a-9df3-4187-bae7-0f0e21f06376
        level: CAN_MANAGE
